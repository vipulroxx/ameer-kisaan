name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ak
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: src/Backend
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/Backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (incl. security rules)
        run: ruff check .
      - name: Tests (auth, RBAC, data isolation, uploads, AI guardrails)
        run: pytest
      - name: Same tests on the Postgres table backend (free hosting) + DynamoDB parity checks
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/ak
        run: pytest
      - name: Known-vulnerability scan of Python dependencies
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Build
        # CI=false: the existing components still have lint warnings; tighten to CI=true once they are fixed.
        run: CI=false INLINE_RUNTIME_CHUNK=false GENERATE_SOURCEMAP=false npm run build
      - name: Dependency audit (report only)
        run: npm audit --omit=dev --audit-level=critical || true

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false
      - run: terraform validate

  containers:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Build images
        run: |
          docker build -t ameer-kisaan-backend:ci src/Backend
          docker build -t ameer-kisaan-frontend:ci .
          docker build -f Dockerfile.render -t ameer-kisaan-render:ci .
      - name: Scan images for HIGH/CRITICAL vulnerabilities
        run: |
          failed=0
          for img in backend frontend render; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
              image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress ameer-kisaan-$img:ci \
              || failed=1
          done
          exit $failed
