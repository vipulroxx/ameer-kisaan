# Included in every location: nginx drops inherited add_header lines when a location sets its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(self)" always;
# S3_PUBLIC_ORIGIN is the photo host for presigned URLs (local S3 or the AWS bucket)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https: http://localhost:9000; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.open-meteo.com https://tfhub.dev https://www.kaggle.com https://*.kaggle.com https://storage.googleapis.com; frame-src https://www.youtube.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
